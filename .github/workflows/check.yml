name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: npm ci
      # The tests and the validation run in the engine of the latest Claude Code; they need no login.
      - run: npm install --global @anthropic-ai/claude-code@latest
      - run: mise run check
      - run: mise run knip
      - run: mise run validate
      - run: mise run test
      - run: mise run pi:typecheck
      - run: mise run pi:test
      - run: mise run pi:build
