name: Release

# Every change of the plugin on main gets a new version, so `claude plugin update`
# and the /plugin menu see an update. The version lives in .claude-plugin/plugin.json.
# It runs only after Check passed on that push, so a broken mod is never released.
on:
  workflow_run:
    workflows: [Check]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ebb-release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump the version, commit and tag
        run: |
          git fetch --force --tags origin main
          # A queued run for an older commit must not release over a newer one.
          if [ "$(git rev-parse FETCH_HEAD)" != "$SHA" ]; then
            echo "main moved past $SHA; skipping"
            exit 0
          fi
          git checkout -q "$SHA"
          # Only a change of the mod since the last release makes a new version.
          last="$(git describe --tags --abbrev=0 --match 'v*')"
          if git diff --quiet "$last" "$SHA" -- hooks types .claude-plugin; then
            echo "No change of the mod since $last; skipping"
            exit 0
          fi
          manifest=.claude-plugin/plugin.json
          current="$(jq -r .version "$manifest")"
          IFS=. read -r major minor patch <<< "$current"
          next="$major.$minor.$((patch + 1))"
          jq --arg v "$next" '.version = $v' "$manifest" > "$manifest.new" && mv "$manifest.new" "$manifest"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "Release v$next" -- "$manifest"
          git tag "v$next"
          # Both or neither: a main that moved since the fetch refuses the push.
          # A push made with the workflow's token starts no new run.
          git push --atomic origin HEAD:main "refs/tags/v$next"
          echo "Released v$next"
