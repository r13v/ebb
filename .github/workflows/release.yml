name: Release

# Every change of the plugin on main gets a new version, so `claude plugin update`
# and the /plugin menu see an update. The version lives in .claude-plugin/plugin.json.
on:
  push:
    branches: [main]
    paths: [hooks/**, types/**, .claude-plugin/**]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ebb-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump the version, commit and tag
        run: |
          git fetch --force --tags origin main
          # A queued run for an older commit must not release over a newer one.
          if [ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]; then
            echo "main moved past $GITHUB_SHA; skipping"
            exit 0
          fi
          manifest=.claude-plugin/plugin.json
          current="$(jq -r .version "$manifest")"
          IFS=. read -r major minor patch <<< "$current"
          next="$major.$minor.$((patch + 1))"
          jq --arg v "$next" '.version = $v' "$manifest" > "$manifest.new" && mv "$manifest.new" "$manifest"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "Release v$next" -- "$manifest"
          git tag "v$next"
          # Both or neither: a main that moved since the fetch refuses the push.
          # A push made with the workflow's token starts no new run.
          git push --atomic origin HEAD:main "refs/tags/v$next"
          echo "Released v$next"
